<script>
    /* Quarto's listing script reads window["quarto-listings"] on every hashchange, but only
       defines it when a native `.list` element exists. Our own list engine (writing.js) uses
       the URL hash for its filters, so without this line each filter click logs a TypeError. */
    window["quarto-listings"] = window["quarto-listings"] || {};
</script>
<script>
    /* Restore saved language's reading direction/lang attribute before first paint,
       so a returning FR/AR visitor doesn't see a layout flip once Google Translate
       loads. The actual text still switches once the widget initializes on this
       page too — that part can't happen before paint, this only fixes the
       *layout direction* flash. */
    (function () {
        try {
            var sl = localStorage.getItem("sl");
            /* Article pages set window.__articleLang themselves (assets/lua/article.lua):
               <html lang/dir> then describe the article, not the interface. */
            if (sl && !window.__articleLang) {
                document.documentElement.setAttribute("lang", sl);
                document.documentElement.setAttribute("dir", sl === "ar" ? "rtl" : "ltr");
            }
        } catch (e) { }
    })();
</script>
