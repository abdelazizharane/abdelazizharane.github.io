<!-- Scroll-to-top -->
<button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  aria-label="Retour en haut"
  style="display:none;position:fixed;bottom:1.5rem;right:1.5rem;width:40px;height:40px;border-radius:50%;background:var(--h-green,#1B5E3B);color:#fff;border:none;cursor:pointer;font-size:1.1rem;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:999;transition:opacity .2s;">↑</button>

<!-- Noto Sans Arabic pour le mode RTL -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet" />

<!-- Système i18n -->
<script src="/assets/js/i18n.js"></script>

<script>
// Scroll-to-top
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTopBtn');
  if (btn) btn.style.display = window.scrollY > 400 ? 'block' : 'none';
});
</script>
