name: Deploy Quarto Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.3.3', use-public-rspm: true }
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('setup.R') }}
      - run: source("setup.R")
        shell: Rscript {0}
      - uses: quarto-dev/quarto-actions/setup@v2
        with: { version: 'release' }
      - uses: actions/cache@v4.2.3
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-${{ hashFiles('**/*.qmd') }}
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3.0.1
        with: { path: '_site' }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5