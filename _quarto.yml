project:
  type: website
  output-dir: _site
  # Les dossiers/fichiers dont le nom commence par "_" (ex. blog/_modeles/)
  # sont ignorés par Quarto : ce sont les modèles d'articles, pas des pages.
  render:
    - "*.qmd"
    - "blog/**/*.qmd"
    - "essais/**/*.qmd"
  resources:
    - "assets/js/*.js"
    - "assets/img/*"
    # gallery photos (Medias → Photos), also the large format  grand .
    - "assets/img/galerie/*"
    # Fichiers joints aux articles (PDF, jeux de données, .bib) référencés dans `links:`.
    - "blog/*/files/*"
    - "essais/*/files/*"

website:
  title: "Abdel-aziz Harane"
  favicon: assets/img/favicon.svg

  site-url: "https://abdelazizharane.com"
  open-graph:
    # default image (1200×630)
    image: /assets/img/og-default.png
    image-alt: "Abdel-aziz Harane, ingénieur ML/NLP et chercheur, Chad AI Network"
  twitter-card:
    card-style: summary_large_image
    image: /assets/img/og-default.png

  navbar:
    pinned: true
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Recherche"
        href: research.qmd
      - text: "Projets"
        href: projects.qmd
      # « Écrits » regroupe Blog et Essais (sous-onglets en haut des deux pages).
      - text: "Écrits"
        href: blog/index.qmd
      - text: "Médias"
        href: medias.qmd
      - text: "CV"
        href: cv.qmd
  # Recherche plein texte : l'index search.json sert à la recherche des pages Blog et Essais.
  search:
    location: navbar
    type: overlay
    limit: 12
    keyboard-shortcut: ["/"]

  page-footer:
    left: "Abdel-aziz Harane Abounounou"
    center:
      - text: '<i class="bi bi-linkedin" aria-hidden="true"></i> LinkedIn'
        href: https://www.linkedin.com/in/abdel-aziz-harane/
      - text: '<i class="bi bi-github" aria-hidden="true"></i> GitHub'
        href: https://github.com/abdelazizharane
      - text: '<i class="bi bi-twitter-x" aria-hidden="true"></i> X'
        href: https://x.com/Abdel_azizH
    right: '[Chad AI Network](https://chadainetwork.org) : Résoudre les problèmes locaux'

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css:
      - assets/css/main.css
      - assets/css/writing.css
    include-in-header: assets/html/head.html
    include-after-body: assets/html/foot.html
    toc: false
    smooth-scroll: true
    page-layout: full
    title-block-banner: false
    code-tools: false
    code-copy: true
    anchor-sections: false
    code-overflow: scroll
    highlight-style: a11y    # contrast color (WCAG AA).
    link-external-newwindow: true
    echo: false
    # blog and essays articles gabarits
    filters:
      - assets/lua/article.lua

execute:
  freeze: auto
  warning: false
  message: false
  echo: false

lang: fr