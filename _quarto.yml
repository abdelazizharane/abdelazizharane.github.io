project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "blog/index.qmd"
    - "blog/*.qmd"
    - "articles/index.qmd"

website:
  title: "Abdel-aziz Harane"
  description: "ML/NLP Engineer & AI Researcher — Chad AI Network"
  favicon: assets/img/favicon.svg
  site-url: "https://abdelazizharane.github.io"

  sidebar:
    style: "docked"
    background: "light"
    collapse-level: 1
    contents:
      - text: "About"
        href: index.qmd
        icon: person-circle
      - text: "Blog"
        href: blog/index.qmd
        icon: journal-text
      - text: "Articles"
        href: articles/index.qmd
        icon: book

  page-footer:
    left: "© 2025 Abdel-aziz Harane · [Chad AI Network](https://chadainetwork.org)"
    right: "Construit avec [Quarto](https://quarto.org)"

  open-graph:
    title: "Abdel-aziz Harane"
    description: "ML/NLP Engineer, fondateur du Chad AI Network."
  twitter-card:
    title: "Abdel-aziz Harane"
    card-style: summary

format:
  html:
    theme:
      light: [flatly, assets/css/harane-light.scss]
      dark:  [darkly, assets/css/harane-dark.scss]
    css: assets/css/harane.css
    include-in-header: assets/html/head-extra.html
    include-after-body: assets/html/body-extra.html
    toc: false
    number-sections: false
    smooth-scroll: true
    # ── Code : TOUT masqué — jamais de bouton "Code source" ──
    code-fold: false
    code-tools: false
    code-copy: false
    code-link: false
    echo: false
    highlight-style: github
    fig-align: center
    fig-cap-location: bottom
    df-print: paged
    link-external-newwindow: true

execute:
  freeze: auto
  cache: false
  warning: false
  message: false
  echo: false        # ← ne jamais afficher le code dans les pages

bibliography: references.bib
csl: assets/csl/apa.csl
link-citations: true

lang: fr
